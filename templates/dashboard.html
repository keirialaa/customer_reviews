<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
    <title>Customer Reviews Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
  </head>
  <body class="lexend-main">
    <div id="loading-state">
      <div class="container-2">
        <div
          class="card"
          id="loading"
          style="text-align: center; padding: 100px 20px"
        >
          <h2 class="pulse">Analyzing Reviews...</h2>
          <div class="progress-container">
            <div id="progress-fill"></div>
          </div>
          <p id="status-text">
            Our engine is processing your data. Please wait.
          </p>
        </div>
      </div>
    </div>

    <div id="dashboard-content" style="display: none">
      <div class="container-2">
        <h1>Dashboard</h1>

        <div class="summary">
          <div class="vertical">
            <div class="total card">
              <h3>Reviews Analyzed</h3>
              <h3 class="big-num" id="total-reviews">0</h3>
            </div>
            <div class="avg-sent card">
              <h3>Average Sentiment Score</h3>
              <h3 class="big-num" id="avg-score-display">0</h3>
            </div>
          </div>

          <div class="horizontal">
            <div class="sent-breakdown card">
              <h3>Sentiment Breakdown</h3>
              <canvas id="sentimentChart"></canvas>
            </div>
            <div class="sent-breakdown card">
              <h3>Sentiment by Category</h3>
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
        </div>

        <div class="categories">
          <div class="horizontal">
            <div class="top-products card">
              <div class="card-header">
                <h3>Best Products</h3>
                <div class="tab-toggle">
                  <button
                    onclick="toggleRankings('best', 'overall', event)"
                    class="tab-btn active lexend-main"
                  >
                    Overall
                  </button>
                  <button
                    onclick="toggleRankings('best', 'category', event)"
                    class="tab-btn lexend-main"
                  >
                    By Category
                  </button>
                </div>
              </div>
              <div id="best-products-list" class="product-list"></div>
            </div>
            <div class="worst-products card">
              <div class="card-header">
                <h3>Worst Products</h3>
                <div class="tab-toggle">
                  <button
                    onclick="toggleRankings('worst', 'overall', event)"
                    class="tab-btn active lexend-main"
                  >
                    Overall
                  </button>
                  <button
                    onclick="toggleRankings('worst', 'category', event)"
                    class="tab-btn lexend-main"
                  >
                    By Category
                  </button>
                </div>
              </div>
              <div id="worst-products-list" class="product-list"></div>
            </div>
          </div>
        </div>

        <div class="section-3">
          <div class="sent-over-time card">
            <h3>Sentiment over Time</h3>
            <div id="time-chart-wrapper">
              <canvas id="sentTimeChart"></canvas>
            </div>
            <div
              id="no-time-data"
              style="display: none"
              class="no-data-overlay"
            >
              <p>No date data available to display trends.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
