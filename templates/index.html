<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Reviews Dashboard</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="lexend-main">
    <div class="container">
      <div class="index-text">
        <h1>Analyze Customer Reviews</h1>
        <div class="index-paragraphs">
          <p>This tool will help you</p>
          <p>Please pay attention to the required file format:</p>
        </div>
      </div>
      <form action="/upload" method="post" enctype="multipart/form-data">
        <div class="upload-container" id="drop-zone">
          <div class="upload-icon">⬆️</div>

          <p id="file-name">No file selected</p>
          <p class="hint">Drag & drop or click to upload</p>

          <input
            type="file"
            name="file"
            id="file-input"
            accept=".csv"
            required
          />
        </div>

        <button type="submit" class="analyze-btn">Analyze Reviews</button>
      </form>
    </div>
    <script src="../static/js/script.js"></script>
  </body>
</html>
